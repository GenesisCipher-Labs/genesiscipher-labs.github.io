<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#171717}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:8px;text-align:left;vertical-align:top}a{color:#0645ad}body{overflow-wrap:anywhere}h1,h2,h3{line-height:1.2}nav{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}a:focus-visible{outline:3px solid #0645ad;outline-offset:4px}.skip-link{position:absolute;left:-10000px}.skip-link:focus{position:static}main{min-width:0}table{display:block;overflow-x:auto}footer{margin-top:3rem;padding-top:1rem;border-top:1px solid #bbb;font-size:.9rem}@media(max-width:480px){body{margin:24px auto;padding:0 16px}th,td{min-width:130px}}</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav aria-label="Main navigation"><a href="/">GenesisCipher Labs</a><a href="/get/">HomeSafe</a><a href="/pact/">Pact</a><a href="mailto:genesiscipherlabs@gmail.com">Contact</a></nav>
  <main id="main">{{ content }}</main>
  <footer>GenesisCipher Labs Private Limited · <a href="mailto:genesiscipherlabs@gmail.com">Support</a></footer>
</body>
</html>
